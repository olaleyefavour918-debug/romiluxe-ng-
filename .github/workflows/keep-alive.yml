name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 6 * * *'   # runs once every day at 6am UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write and remove a heartbeat row (real DB activity)
        env:
          SUPABASE_URL: "https://crrtunosemhnmiaquevn.supabase.co"
          SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNycnR1bm9zZW1obm1pYXF1ZXZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1OTA4MjUsImV4cCI6MjEwMzE2NjgyNX0.H22GBlIwpMM9k-3X1K_ufZ91k4DOA9LArmG8c4b_LE8"
        run: |
          echo "Inserting heartbeat row..."
          curl -s -w "\nInsert responded with status: %{http_code}\n" -X POST \
            "$SUPABASE_URL/rest/v1/keepalive_heartbeat" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{}'

          echo "Cleaning up old heartbeat rows..."
          curl -s -o /dev/null -w "Delete responded with status: %{http_code}\n" -X DELETE \
            "$SUPABASE_URL/rest/v1/keepalive_heartbeat?pinged_at=lt.$(date -u -d '1 minute ago' +%Y-%m-%dT%H:%M:%S)" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
